  spend_usd: "not tracked"

fidelity:
  divergences: >-
    (1) Costs are counted operations in the arithmetic model, not machine steps:
    the algorithms are written in a writer monad and the count is the number of
    ring operations performed through its charged primitives (an inversion
    counts as one multiplication; moving, copying, padding and reindexing data
    is free). The statements are about the explicit algorithms defined in
    FastGE/Spec.lean, whose definitions are part of the statement. (2)
    Algorithms that use matrix multiplication take a bundled multiplication
    algorithm (a counted procedure with proofs of correctness and of an
    operation bound M) as a parameter, and their counts include the counts of
    its calls; the bounds are in terms of M, or of an exponent omega and
    constant C. (3) Inversion requires nonzero leading principal minors; block
    elimination along the separator tree requires the regularity hypothesis
    NodeRegular, which holds when all principal minors are nonzero, in
    particular for positive definite matrices (proved in the library,
    FastGE.FastDissection.allNodes_nodeRegular_of_forall, and used for
    FastGE.square_fast_determinant_posDef). (4) Plane graphs are rotation
    systems of connected simple graphs satisfying Euler's formula, so the three
    nested-dissection statements are about connected graphs with at least one
    edge (the one-vertex graph has no darts, hence no faces, and is not plane
    here). Nested dissection applies to all planar graphs; the disconnected
    case, which follows by joining the components with extra edges, is not
    formalized. (5) The separator-tree constants (50000 for plane graphs, 40
    (1062 (D + 1)^2 + 1) for squares of graphs of maximum degree D) are not
    optimized.

review:
  status: "unreviewed"
  reviewers: []
  notes: >-
    No claims beyond the verification report for the submitted commit. The
    proofs have not been reviewed by a person.

alignment:
  namespace: "FastGE"
  statements:
    - source: "Strassen 1969: 7^k multiplications for matrices of size 2^k"
      lean: "FastGE.strassen_count"
      module: "FastGESolution"
      status: proved
    - source: "Strassen 1969: matrix multiplication in O(n^(log2 7)) operations"
      lean: "FastGE.strassen_exponent"
      module: "FastGESolution"
      status: proved
    - source: "Strassen 1969; Bunch-Hopcroft 1974: inversion and the determinant in O(M(n)) operations, nonzero leading principal minors"
      lean: "FastGE.inverse_determinant"
      module: "FastGESolution"
      status: proved
    - source: "Lipton-Rose-Tarjan 1979 with fast multiplication: determinants with planar pattern in O(n^(omega/2))"
      lean: "FastGE.planar_fast_determinant"
      module: "FastGESolution"
      status: proved
    - source: "The same for squares of planar graphs of bounded degree"
      lean: "FastGE.square_fast_determinant"
      module: "FastGESolution"
      status: proved
    - source: "The same for positive definite matrices on squares of planar graphs of bounded degree"
      lean: "FastGE.square_fast_determinant_posDef"
      module: "FastGESolution"
      status: proved

